<svg xmlns="http://www.w3.org/2000/svg" width="680" height="618" viewBox="0 0 680 618" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
<title>TemporalLens system layers</title>
<desc>Four stacked layers: an implemented data layer, a specified foundation encoder layer, two parallel research arms, and an evaluation layer. Colour marks whether each layer is implemented, specified only, or blocked on open decisions.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="618" fill="#FFFFFF"/>

<rect x="40" y="40" width="600" height="104" rx="4" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="52" y="58" font-size="12" fill="#5F5E5A">Data layer</text>
<rect x="52" y="66" width="178" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="66" y="90" font-size="14" font-weight="500" fill="#085041">ninapro.py</text>
<text x="66" y="108" font-size="12" fill="#0F6E56">corrected labels only</text>
<rect x="251" y="66" width="178" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="265" y="90" font-size="14" font-weight="500" fill="#085041">windows.py</text>
<text x="265" y="108" font-size="12" fill="#0F6E56">no boundary crossing</text>
<rect x="450" y="66" width="178" height="56" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="464" y="90" font-size="14" font-weight="500" fill="#085041">splits.py</text>
<text x="464" y="108" font-size="12" fill="#0F6E56">hash-verified split</text>

<line x1="340" y1="144" x2="340" y2="168" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="40" y="168" width="600" height="104" rx="4" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="52" y="186" font-size="12" fill="#5F5E5A">Foundation, F0 to F5</text>
<rect x="52" y="194" width="178" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="66" y="218" font-size="14" font-weight="500" fill="#444441">1-D CNN encoder</text>
<text x="66" y="236" font-size="12" fill="#5F5E5A">12 ch to 256-d</text>
<rect x="251" y="194" width="178" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="265" y="218" font-size="14" font-weight="500" fill="#444441">classifier head</text>
<text x="265" y="236" font-size="12" fill="#5F5E5A">18 classes</text>
<rect x="450" y="194" width="178" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="464" y="218" font-size="14" font-weight="500" fill="#444441">refit.pt</text>
<text x="464" y="236" font-size="12" fill="#5F5E5A">F1 reference row</text>

<line x1="340" y1="272" x2="340" y2="284" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M340 284 L186 284 L186 296" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M340 284 L494 284 L494 296" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="40" y="296" width="292" height="152" rx="4" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="54" y="314" font-size="12" fill="#5F5E5A">Language arm, secondary</text>
<rect x="54" y="324" width="264" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="68" y="346" font-size="14" font-weight="500" fill="#444441">projector</text>
<text x="68" y="363" font-size="12" fill="#5F5E5A">256-d to soft prefix</text>
<rect x="54" y="386" width="264" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="68" y="408" font-size="14" font-weight="500" fill="#444441">frozen Llama 3.2</text>
<text x="68" y="425" font-size="12" fill="#5F5E5A">discriminative head</text>

<rect x="348" y="296" width="292" height="152" rx="4" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="362" y="314" font-size="12" fill="#5F5E5A">Generative arm, headline</text>
<rect x="362" y="324" width="264" height="50" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="376" y="346" font-size="14" font-weight="500" fill="#633806">conditional VAE</text>
<text x="376" y="363" font-size="12" fill="#854F0B">latent-space synthesis</text>
<rect x="362" y="386" width="264" height="50" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="376" y="408" font-size="14" font-weight="500" fill="#633806">k-shot adaptation</text>
<text x="376" y="425" font-size="12" fill="#854F0B">four matched curves</text>

<path d="M186 448 L186 460 L340 460" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
<path d="M494 448 L494 460 L340 460" fill="none" stroke="#5F5E5A" stroke-width="0.5"/>
<line x1="340" y1="460" x2="340" y2="472" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="40" y="472" width="600" height="104" rx="4" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="52" y="490" font-size="12" fill="#5F5E5A">Evaluation and protocol</text>
<rect x="52" y="498" width="178" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="66" y="522" font-size="14" font-weight="500" fill="#444441">metrics</text>
<text x="66" y="540" font-size="12" fill="#5F5E5A">macro-F1, ECE, Brier</text>
<rect x="251" y="498" width="178" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="265" y="522" font-size="14" font-weight="500" fill="#444441">inference unit</text>
<text x="265" y="540" font-size="12" fill="#5F5E5A">subject, paired</text>
<rect x="450" y="498" width="178" height="56" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="464" y="522" font-size="14" font-weight="500" fill="#444441">robustness</text>
<text x="464" y="540" font-size="12" fill="#5F5E5A">every arm, D2</text>

<rect x="40" y="584" width="10" height="10" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="56" y="593" font-size="12" fill="#5F5E5A">implemented and tested</text>
<rect x="220" y="584" width="10" height="10" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="236" y="593" font-size="12" fill="#5F5E5A">specified, not written</text>
<rect x="396" y="584" width="10" height="10" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="412" y="593" font-size="12" fill="#5F5E5A">blocked on open decisions</text>
</svg>
