# FROZEN SPLIT MANIFEST — subject-independent, v1.
#
# This file is DATA, not configuration. It is frozen once and never revised in place: a changed
# split makes every previously reported number incomparable, and the language arm's whole claim is
# a comparison against F1's reference row. To change the split, add subject_independent_v2.yaml
# and record why in DECISIONS. Do not edit this file.
#
# `manifest_hash` is a SHA-256 over the split-defining fields only (see
# src/temporallens/data/splits.py, HASHED_FIELDS). Comments and prose here may be reworded; the
# subject assignments cannot. Every consumer calls SplitManifest.load(), which recomputes the
# digest and refuses to return a split that does not match.
#
# Spec: docs/experiments/README.md §3.2. Decisions: D6 (8-fold CV), D12 (label columns),
# D13 (repetition policy).

schema_version: 1
split: subject_independent

dataset:
  name: ninapro_db2
  exercise: B
  num_classes: 18 # 17 active gestures + rest
  num_subjects: 40
  # D12: the corrected columns, never `stimulus`/`repetition`. The uncorrected labels are offset
  # by each subject's reaction time and mislabel every movement onset.
  label_column: restimulus
  repetition_column: rerepetition

# Fixed by the spec before any modelling; never re-drawn. These 8 subjects are excluded from
# population training and model selection. G3/G4 may use only their paid calibration repetitions;
# their disjoint evaluation repetitions remain score-only.
test_subjects: [5, 10, 15, 20, 25, 30, 35, 40]

# The remaining 32. Every one serves as validation in exactly one fold.
training_subjects:
  [
    1, 2, 3, 4,
    6, 7, 8, 9,
    11, 12, 13, 14,
    16, 17, 18, 19,
    21, 22, 23, 24,
    26, 27, 28, 29,
    31, 32, 33, 34,
    36, 37, 38, 39,
  ]

num_folds: 8
validation_subjects_per_fold: 4

# Assignment is strided, not blocked: the i-th training subject goes to fold i mod 8. Striding
# gives every fold one subject from each quarter of the ID range, avoiding a fold made from one
# contiguous ID block. Subject ID is not treated as a verified acquisition timestamp (D17).
#
# A fold's TRAINING set is the complement: training_subjects minus this fold's validation
# subjects (28 subjects). It is deliberately not listed, so a subject's role is stated in exactly
# one place and the two cannot drift apart.
folds:
  - index: 0
    validation_subjects: [1, 11, 21, 31]
  - index: 1
    validation_subjects: [2, 12, 22, 32]
  - index: 2
    validation_subjects: [3, 13, 23, 33]
  - index: 3
    validation_subjects: [4, 14, 24, 34]
  - index: 4
    validation_subjects: [6, 16, 26, 36]
  - index: 5
    validation_subjects: [7, 17, 27, 37]
  - index: 6
    validation_subjects: [8, 18, 28, 38]
  - index: 7
    validation_subjects: [9, 19, 29, 39]

# D13. All 6 repetitions follow their subject across the train/validation/test boundary — the
# subject is the split unit, so within-subject drift never straddles a split.
#
# `calibration` and `evaluation` partition the repetitions for subject calibration only (G3/G4).
# They are disjoint per leakage rule 3. Calibration spans early and late rather than taking the
# first two, because the DB2 descriptor measured significant amplitude drift across repetitions
# in 12.5% of subjects; calibrating on {1,2} and scoring on {3,4,5,6} would measure adaptation to
# that drift instead of to the subject.
repetitions:
  all: [1, 2, 3, 4, 5, 6]
  policy: follow_subject
  calibration: [1, 4]
  evaluation: [2, 3, 5, 6]

manifest_hash: "sha256:a9609e264eeac9da2b5ea0f10a70a95746062841061d53cc85fba608dfff0e30"
