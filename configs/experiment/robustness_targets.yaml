# Robustness target registry (D2).
#
# Single source of truth for WHICH trained models get the robustness suite. Each F3/F4/F5
# perturbation is evaluated against every target listed here whose artifact exists: a checkpoint
# file for F1/language targets or a run directory for G3. Targets without an artifact yet are
# skipped by scripts/evaluate.py with a clear log line, so the suite is runnable incrementally.
#
# This file is shared infrastructure, not an ablation — hence it sits at the experiment root,
# beside foundation/, generation/, language/, rather than inside any one of them.
#
# CHECKPOINT CONTRACT: every checkpoint is saved as {model_state, model_config}, so a consumer
# rebuilds the exact architecture from the checkpoint alone. A target therefore carries a name
# plus one artifact locator (`checkpoint` or `run_dir`) with NO model_type — the old model_type
# field could not describe the adapter stacks (encoder + projector + backbone + head) and is gone.
#
# WHICH checkpoint: targets point at refit.pt — the model refit on the full training-subject set
# using the cross-validated hyperparameters. It is the only checkpoint any downstream consumer
# reads. The per-fold checkpoints (folds/fold{k}/best.pt) are for extended analysis, never for
# consumption; "best" means best-epoch-by-validation within a fold, which is why the refit
# artifact carries a different name instead of overloading that word.

targets:
  # --- Foundation ---
  - name: f1_encoder
    arm: foundation
    checkpoint: checkpoints/baseline_cnn_subject_split/refit.pt

  # --- Language arm (D2: robustness on the adapter stacks, not only the encoder) ---
  - name: l2_frozen_llm
    arm: language
    checkpoint: checkpoints/adapter_llama3b_subject_split/refit.pt
  - name: l3_random_transformer
    arm: language
    checkpoint: checkpoints/adapter_random_transformer/refit.pt
  - name: l4_text_summary
    arm: language
    checkpoint: checkpoints/adapter_text_summary_only/refit.pt

  # --- Generative arm ---
  # G3 does not produce a single refit.pt: it trains decoders across held-out subjects, schedules,
  # k, and strategy. Its robustness targets are therefore RUN slices, not static files, so they use
  # `run_dir` instead of `checkpoint`. Both adapted strategies are required: without the matched
  # real-adaptation slice, robustness cannot say whether the synthetic advantage survives shift.
  # The future runner must resolve `latest` to an immutable recorded run ID and expand every
  # declared artifact axis before scoring.
  - name: g3_real_adaptation
    arm: generation
    strategy: real_adaptation
    artifact_axes: [held_out_subject, schedule_index, calibration_trials]
    run_selection: pending_immutable_run_id
    run_dir: results/runs/gen_personalization_efficiency/latest
  - name: g3_synthetic_adaptation
    arm: generation
    strategy: real_plus_synthetic_adaptation
    artifact_axes: [held_out_subject, schedule_index, calibration_trials]
    run_selection: pending_immutable_run_id
    run_dir: results/runs/gen_personalization_efficiency/latest
