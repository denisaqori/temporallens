# Robustness target registry (D2).
#
# Single source of truth for WHICH trained models get the robustness suite. Each F3/F4/F5
# perturbation is evaluated against every ready target listed here whose artifact exists: a
# checkpoint file for F1/language targets or a run directory for G3. A target carrying any
# unresolved `pending_*` sentinel is blocked before artifact lookup. Its `source_config` is also
# checked, and a non-ready source protocol blocks dispatch. A ready target without an artifact yet
# is skipped by scripts/evaluate.py with a clear log line, so the suite is runnable incrementally
# without treating an unresolved protocol as executable.
#
# This file is shared infrastructure, not an ablation — hence it sits at the experiment root,
# beside foundation/, generation/, language/, rather than inside any one of them.
#
# CHECKPOINT CONTRACT: every checkpoint is saved as {model_state, model_config}, so a consumer
# rebuilds the exact architecture from the checkpoint alone. A target therefore carries a name
# plus one artifact locator (`checkpoint` or `run_dir`) with NO model_type — the old model_type
# field could not describe the adapter stacks (encoder + projector + backbone + head) and is gone.
#
# WHICH checkpoint: file-shaped targets point at refit.pt — the model refit on the full
# training-subject set using the cross-validated hyperparameters. It is the only checkpoint any
# downstream consumer reads. The per-fold checkpoints (folds/fold{k}/best.pt) are for extended
# analysis, never for consumption; "best" means best-epoch-by-validation within a fold, which is
# why the refit artifact carries a different name instead of overloading that word. Run-shaped G3
# targets instead resolve their per-subject heads from the declared run directory.
#
# Language targets (D66/D76) have one refit per reporting seed, so they name a checkpoint_pattern
# over reporting_seed_index within one explicit digest-verified accepted campaign (D85),
# never a mutable latest pointer. Evaluate every seed's refit with its own
# temperature, then average metrics within each subject before inference. Resolving that pattern
# is not implemented, so artifact_resolution keeps them blocked even after their source protocol
# becomes ready; a single-file lookup would silently score one seed or none.

targets:
  # --- Foundation ---
  - name: f1_encoder
    arm: foundation
    source_config: configs/experiment/foundation/baseline_cnn_subject_split.yaml
    checkpoint: checkpoints/baseline_cnn_subject_split/refit.pt
    temperature_source: model_config.probability_calibration

  # --- Language arm (D2: robustness on the adapter stacks, not only the encoder) ---
  - name: l2_frozen_llm
    arm: language
    source_config: configs/experiment/language/adapter_llama3b_subject_split.yaml
    checkpoint_pattern: checkpoints/language_campaigns/{campaign_id}/adapter_llama3b_subject_split/reporting/seed{reporting_seed_index}/refit.pt
    accepted_campaign_manifest_pattern: checkpoints/language_campaigns/{campaign_id}/accepted_manifest.json
    campaign_selection: explicit_accepted_manifest_path_and_sha256_no_latest
    artifact_axes: [reporting_seed_index]
    reporting_seed_indices_source: training.repeats.seed_indices
    within_subject_repeat_aggregation: equal_weight_mean_over_seed_runs
    artifact_resolution: pending_implementation
    temperature_source: model_config.probability_calibration
  - name: l3_random_transformer
    arm: language
    source_config: configs/experiment/language/adapter_random_transformer.yaml
    checkpoint_pattern: checkpoints/language_campaigns/{campaign_id}/adapter_random_transformer/reporting/seed{reporting_seed_index}/refit.pt
    accepted_campaign_manifest_pattern: checkpoints/language_campaigns/{campaign_id}/accepted_manifest.json
    campaign_selection: explicit_accepted_manifest_path_and_sha256_no_latest
    artifact_axes: [reporting_seed_index]
    reporting_seed_indices_source: training.repeats.seed_indices
    within_subject_repeat_aggregation: equal_weight_mean_over_seed_runs
    artifact_resolution: pending_implementation
    temperature_source: model_config.probability_calibration
  - name: l4_text_summary
    arm: language
    source_config: configs/experiment/language/adapter_text_summary_only.yaml
    checkpoint_pattern: checkpoints/language_campaigns/{campaign_id}/adapter_text_summary_only/reporting/seed{reporting_seed_index}/refit.pt
    accepted_campaign_manifest_pattern: checkpoints/language_campaigns/{campaign_id}/accepted_manifest.json
    campaign_selection: explicit_accepted_manifest_path_and_sha256_no_latest
    artifact_axes: [reporting_seed_index]
    reporting_seed_indices_source: training.repeats.seed_indices
    within_subject_repeat_aggregation: equal_weight_mean_over_seed_runs
    artifact_resolution: pending_implementation
    temperature_source: model_config.probability_calibration
  # D77: whether the LLM route preserves robustness relative to a conventional decoder.
  - name: l6_embedding_mlp_control
    arm: language
    source_config: configs/experiment/language/embedding_mlp_control.yaml
    checkpoint_pattern: checkpoints/language_campaigns/{campaign_id}/embedding_mlp_control/reporting/seed{reporting_seed_index}/refit.pt
    accepted_campaign_manifest_pattern: checkpoints/language_campaigns/{campaign_id}/accepted_manifest.json
    campaign_selection: explicit_accepted_manifest_path_and_sha256_no_latest
    artifact_axes: [reporting_seed_index]
    reporting_seed_indices_source: training.repeats.seed_indices
    within_subject_repeat_aggregation: equal_weight_mean_over_seed_runs
    artifact_resolution: pending_implementation
    temperature_source: model_config.probability_calibration

  # --- Generative arm ---
  # G3 does not produce a single refit.pt: it trains decoders across held-out subjects, schedules,
  # k, and strategy. Its robustness targets are therefore RUN slices, not static files, so they use
  # `run_dir` instead of `checkpoint`. All THREE adapted strategies are required (D29):
  # without the matched real-adaptation slice robustness cannot say whether a synthetic advantage
  # survives shift, and without the population-conditioned slice it cannot say whether any
  # surviving advantage came from subject conditioning rather than generic replay.
  # The future runner must resolve `latest` to an immutable recorded run ID and expand every
  # declared artifact axis before scoring. Adaptation seeds apply to all adapted strategies;
  # synthetic-draw IDs apply only to replay strategies, so copying one common axis list would
  # duplicate real_adaptation rather than create independent evidence. Aggregation across these
  # repeats is still Pending and therefore remains fail-closed here.
  - name: g3_real_adaptation
    arm: generation
    source_config: configs/experiment/generation/gen_personalization_efficiency.yaml
    strategy: real_adaptation
    artifact_axes: [held_out_subject, schedule_index, calibration_trials, adaptation_seed]
    repeat_axis_source: gen_personalization_efficiency.personalization.repeated_run_reproducibility
    within_subject_repeat_aggregation: pending_decision
    k0_artifact_scope:
      model_artifact: one_global_shared_no_adaptation_head
      evaluation_scope: each_held_out_subject_once
    # D29 aliases MODEL WEIGHTS at k=0. D33's G4 query-fitted T is distinct from F1's all-reps T.
    shared_k0_with: f1_encoder
    run_selection: pending_immutable_run_id
    run_dir: results/runs/gen_personalization_efficiency/latest
    temperature_source: frozen_strategy_k_temperature_table
    calibration_source_config: configs/experiment/generation/gen_calibration_efficiency.yaml
    temperature_run_selection: pending_matching_immutable_calibration_run_id
    temperature_artifact_pattern: results/runs/{immutable_calibration_run_id}/temperature_table.json
    temperature_lookup_axes: [strategy, calibration_trials]
    require_matching_model_generator_and_settings_digests: true
  - name: g3_population_synthetic_adaptation
    arm: generation
    source_config: configs/experiment/generation/gen_personalization_efficiency.yaml
    strategy: real_plus_population_synthetic_adaptation
    artifact_axes:
      [held_out_subject, schedule_index, calibration_trials, adaptation_seed, synthetic_draw_id]
    repeat_axis_source: gen_personalization_efficiency.personalization.repeated_run_reproducibility
    within_subject_repeat_aggregation: pending_decision
    k0_artifact_scope:
      model_artifact: one_per_adaptation_seed_and_synthetic_draw_id_shared_across_subjects_and_schedules
      evaluation_scope: each_held_out_subject_once_per_repeat
    run_selection: pending_immutable_run_id
    run_dir: results/runs/gen_personalization_efficiency/latest
    temperature_source: frozen_strategy_k_temperature_table
    calibration_source_config: configs/experiment/generation/gen_calibration_efficiency.yaml
    temperature_run_selection: pending_matching_immutable_calibration_run_id
    temperature_artifact_pattern: results/runs/{immutable_calibration_run_id}/temperature_table.json
    temperature_lookup_axes: [strategy, calibration_trials]
    require_matching_model_generator_and_settings_digests: true
  - name: g3_subject_synthetic_adaptation
    arm: generation
    source_config: configs/experiment/generation/gen_personalization_efficiency.yaml
    strategy: real_plus_subject_synthetic_adaptation
    artifact_axes:
      [held_out_subject, schedule_index, calibration_trials, adaptation_seed, synthetic_draw_id]
    repeat_axis_source: gen_personalization_efficiency.personalization.repeated_run_reproducibility
    within_subject_repeat_aggregation: pending_decision
    # D29: at k=0 this is the exact same run as the population-conditioned replay target.
    shared_k0_with: g3_population_synthetic_adaptation
    run_selection: pending_immutable_run_id
    run_dir: results/runs/gen_personalization_efficiency/latest
    temperature_source: frozen_strategy_k_temperature_table
    calibration_source_config: configs/experiment/generation/gen_calibration_efficiency.yaml
    temperature_run_selection: pending_matching_immutable_calibration_run_id
    temperature_artifact_pattern: results/runs/{immutable_calibration_run_id}/temperature_table.json
    temperature_lookup_axes: [strategy, calibration_trials]
    require_matching_model_generator_and_settings_digests: true
