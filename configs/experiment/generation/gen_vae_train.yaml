# G1 — Conditional VAE over the FROZEN encoder's latent space, conditioned on gesture class
# and a subject/calibration embedding. Trained on TRAINING SUBJECTS ONLY (leakage rule 1).
# The subject embedding must be computable for an unseen subject from the windows contained in the
# subject's k permitted gesture trials at inference,
# so it cannot be a learned per-subject lookup indexed by subject ID. Watch the KL term
# separately: KL -> 0 means posterior collapse and the decoder is ignoring the latent.
# Spec: docs/experiments/generative-arm.md, G1.
protocol:
  # `calibration_derived` is not an implementation. Reject G1 until the embedding contract is fixed.
  status: blocked_pending_decisions
  blocked_on:
    - generator.subject_embedding.estimator
    - generator.subject_embedding.pooling
    - generator.subject_embedding.pseudo_calibration_schedule
    - generator.subject_embedding.target_exclusion_policy
    - generator.subject_embedding.population_embedding
    - generator.subject_embedding.class_information_control
experiment:
  name: gen_vae_train
  seed: 42
  mode: train
tracking:
  json_logging: true
  wandb_mode: online
dataset:
  name: ninapro_db2
  data_dir: data/processed/ninapro_db2
  exercise: B
  split_manifest: configs/splits/subject_independent_v1.yaml
  window_size: 400
  stride: 100
  input_channels: 12
  num_classes: 18
  normalize: train_subjects_global_stats
encoder:
  checkpoint: checkpoints/baseline_cnn_subject_split/refit.pt
  freeze: true
  embedding_dim: 256
generator:
  type: conditional_vae
  latent_space: encoder
  latent_dim: 32
  hidden_dim: 256
  class_conditioning: true
  subject_conditioning: calibration_derived
  subject_embedding:
    status: pending_decision
    output_dim: 16
    estimator: null
    pooling: null
    # Training subjects need simulated k-trial support sets matching deployment.
    pseudo_calibration_schedule: null
    # A target latent must not appear in the support set used to condition its reconstruction.
    target_exclusion_policy: null
    population_embedding: null
    # Prevent gesture-class content from serving as a shortcut for subject identity.
    class_information_control: null
training:
  loss: elbo
  kl_warmup_epochs: 5
  batch_size: 64
  epochs: 60
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  device: cuda
  save_checkpoint: true
evaluation:
  metrics: [elbo, reconstruction_error, kl_divergence]
  checks:
    - kl_term_not_collapsed
    - class_label_changes_sample
    - trained_on_training_subjects_only
