# G1 — Conditional VAE over the FROZEN encoder's latent space, conditioned on gesture class
# and a subject/calibration embedding. Trained on TRAINING SUBJECTS ONLY (leakage rule 1).
# The subject embedding must be computable for an unseen subject from the windows contained in the
# subject's k permitted gesture trials at inference,
# so it cannot be a learned per-subject lookup indexed by subject ID. Watch the KL term
# separately: KL -> 0 means posterior collapse and the decoder is ignoring the latent.
# Spec: docs/experiments/generative-arm.md, G1.
protocol:
  # D27 fixed the embedding contract. The remaining blockers are the VAE objective components
  # (D22 fixed only the sign and name), which the runner must not default.
  status: blocked_pending_decisions
  blocked_on:
    - training.objective_components
    - generator.subject_embedding.pseudo_calibration_schedule.rotation_selection
    - generator.subject_embedding.class_information_control
experiment:
  name: gen_vae_train
  seed: 42
  mode: train
tracking:
  json_logging: true
  wandb_mode: online
dataset:
  name: ninapro_db2
  data_dir: data/processed/ninapro_db2
  exercise: B
  split_manifest: configs/splits/subject_independent_v1.yaml
  window_size: 400
  stride: 100
  input_channels: 12
  num_classes: 18
  normalize: train_subjects_global_stats
encoder:
  checkpoint: checkpoints/baseline_cnn_subject_split/refit.pt
  freeze: true
  embedding_dim: 256
generator:
  type: conditional_vae
  latent_space: encoder
  latent_dim: 32
  hidden_dim: 256
  class_conditioning: true
  subject_conditioning: calibration_derived
  # D27. Encoder latents cluster by gesture, so a plain mean of the support set would encode
  # WHICH gestures the subject demonstrated rather than who they are -- at k<17 the support
  # covers only some classes. Centring on the population per-class mean removes class content
  # by construction, which is why it is the control rather than a separate mechanism.
  subject_embedding:
    output_dim: 16
    estimator: class_centred_mean_latent_residual
    pooling: mean_then_linear_projection
    # Population per-class mean latents, fitted on training subjects only, define the centring.
    centring_reference: training_subject_class_mean_latents
    # Simulate deployment during training: draw k per subject per step across the whole grid,
    # so one generator serves the entire curve and no k is privileged. k=0 trains the
    # population embedding.
    pseudo_calibration_schedule:
      k_grid: [0, 1, 2, 5, 10, 17, 20, 34]
      k_draw: uniform_per_subject_per_step
      support_builder: d14_nested_class_aware_prefix
      # D27 as revised: ROTATE the support repetition pair among the early/late-spanning pairs,
      # so every repetition serves as a reconstruction target in 2 of 3 rotations. Rotation is
      # augmentation -- it stops the estimator memorising artefacts of reps 1 and 4 -- and the
      # spanning shape still matches inference and still straddles the drift D13 measured.
      support_repetition_rotation: [[1, 4], [2, 5], [3, 6]]
      # WHICH rotation a given draw uses, and how it is seeded, inherits D14's PRNG and
      # schedule-index convention -- still Pending. A listed pair set is not a draw rule.
      rotation_selection:
        status: pending_decision
        rule: null
        prng: null
    # Support and targets stay complementary WITHIN each draw, so a target latent can never
    # appear in the set conditioning its own reconstruction. Exclusion is per-draw, not global.
    target_exclusion_policy: draw_complement_of_support_repetitions
    # Rotation applies ONLY to training subjects. Held-out-subject calibration remains D13's
    # fixed {1,4} support / {2,3,5,6} evaluation; loosening that for test subjects is a leak.
    held_out_subject_support: d13_fixed_calibration_repetitions
    population_embedding: learned_vector
    # Centring is the structural fix; this is the check that it worked. Above-chance recovery of
    # the support set's class composition from the embedding fails the gate.
    # Centring removes the class MEAN, not every trace of class information: class-conditional
    # covariance and higher moments survive it. So this probe is load-bearing, not confirmatory,
    # and it cannot stay a slogan.
    class_information_control:
      diagnostic: support_class_composition_probe
      must_be_at_chance: true
      status: pending_decision
      target: null              # what the probe predicts from the embedding
      grouping: null            # must be subject-grouped, or the probe memorises individuals
      model: null
      score: null
      chance_baseline: null
      acceptance_threshold: null
training:
  loss: negative_elbo
  # D22 fixed the sign and name only. These remain Pending; the runner must not default them.
  objective_components:
    status: pending_decision
    reconstruction_likelihood: null
    component_reductions: null
    units: null
    kl_warmup_schedule: null
    evaluation_uses_unit_kl_weight: null
    reported_kl_is_raw_or_weighted: null
  kl_warmup_epochs: 5        # provisional duration; exact warmup contract remains Pending
  batch_size: 64
  epochs: 60
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  device: cuda
  save_checkpoint: true
evaluation:
  metrics: [negative_elbo, reconstruction_error, kl_divergence]
  checks:
    - kl_term_not_collapsed
    - class_label_changes_sample
    # Without this, a generator that ignores subject conditioning passes everything above.
    - subject_embedding_changes_sample
    - trained_on_training_subjects_only
