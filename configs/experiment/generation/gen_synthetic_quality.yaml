# G2 — Synthetic quality by discrimination. THIS IS A GATE, NOT A METRIC: it runs before G3
# is interpreted, and if it fails, G3 is not reported. A classifier two-sample test trains a
# discriminator to separate real encoder latents from generated ones; AUC near 0.5 means the
# approved discriminator did not detect separation, subject to the Pending orientation/CI rule.
#
# Strong separability means the generator is unrealistic; the legacy candidate thresholds assume
# that is oriented toward AUC ~1.0. AUC ~0.5 from a WEAK discriminator means nothing. The
# sanity_generator below must be strongly separable. Fidelity is also not diversity: a generator
# reproducing ten real samples scores near chance and is useless. Nearest-neighbour distance can
# expose memorization; a genuine diversity or coverage diagnostic remains Pending.
# Spec: docs/experiments/generative-arm.md, G2.
protocol:
  # The final test subjects cannot drive a fix-and-rerun loop. Fail closed until the development
  # gate population and the one-shot final diagnostic policy are approved (DECISIONS Pending).
  status: blocked_pending_decisions
  blocked_on:
    - development_gate.subject_source
    - development_gate.fold_aggregation
    - development_gate.conditioning_coverage
    - final_test_diagnostic.failure_policy
    - evaluation.quality_metric_contract_status
experiment:
  name: gen_synthetic_quality
  seed: 42
  mode: evaluate
tracking:
  json_logging: true
  wandb_mode: offline
checkpoint:
  generator: checkpoints/gen_vae_train/refit.pt
  encoder: checkpoints/baseline_cnn_subject_split/refit.pt
dataset:
  name: ninapro_db2
  exercise: B
  split_manifest: configs/splits/subject_independent_v1.yaml
  window_size: 400
  stride: 100
  input_channels: 12
  num_classes: 18
  normalize: train_subjects_global_stats
discriminator:
  type: mlp
  hidden_dim: 128
  dropout: 0.1
  epochs: 20
  learning_rate: 0.001
  # Never point an iterative gate at split_manifest.test_subjects.
  evaluate_on: pending_development_validation_subjects
  # Calibrates the test: the discriminator MUST strongly separate this deliberately poor generator
  # under the legacy candidate orientation, otherwise a near-chance AUC on real synthetic data is
  # meaningless. The quality-metric contract remains Pending.
  sanity_generator: gaussian_matched_moments
development_gate:
  status: pending_decision
  subject_source: null
  fold_aggregation: null
  # Must cover the population-conditioned k=0 distribution and the subject-conditioned k>0
  # distributions that G3 actually consumes, rather than one pooled unconditional AUC.
  conditioning_coverage: null
final_test_diagnostic:
  status: pending_decision
  subject_source: split_manifest.test_subjects
  tuning_after_observation: forbidden
  failure_policy: null
evaluation:
  quality_metric_contract_status: pending_decision
  per_class: true              # a pooled AUC hides a generator that fails on rare movements
  metrics:
    - discriminator_auc
    - discriminator_auc_confidence_interval
    - nearest_neighbour_distance   # memorization check; diversity/coverage remains Pending
    - per_class_discriminator_auc
  # Candidate point thresholds only; DECISIONS Pending must resolve the quality-metric and
  # acceptance contract before this blocked protocol becomes executable.
  gate:
    pass_if_auc_within: [0.45, 0.55]
    sanity_generator_auc_above: 0.90
