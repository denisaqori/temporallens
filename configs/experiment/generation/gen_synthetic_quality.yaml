# G2 — Synthetic quality by discrimination. THIS IS A GATE, NOT A METRIC: it runs before G3
# is interpreted, and if it fails, G3 is not reported. A classifier two-sample test trains a
# discriminator to separate real encoder latents from generated ones; AUC near 0.5 indicates
# a realistic synthetic distribution.
#
# Both failure directions matter. AUC ~1.0 means the generator is unrealistic. AUC ~0.5 from a
# WEAK discriminator means nothing — hence the sanity_generator below, which the discriminator
# must score near 1.0. Fidelity is also not diversity: a generator reproducing ten real samples
# scores near chance and is useless, so nearest-neighbour distance is reported alongside.
# Spec: docs/experiments/generative-arm.md, G2.
protocol:
  # The final test subjects cannot drive a fix-and-rerun loop. Fail closed until the development
  # gate population and the one-shot final diagnostic policy are approved (DECISIONS Pending).
  status: blocked_pending_decisions
  blocked_on:
    - development_gate.subject_source
    - development_gate.fold_aggregation
    - development_gate.conditioning_coverage
    - final_test_diagnostic.failure_policy
experiment:
  name: gen_synthetic_quality
  seed: 42
  mode: evaluate
tracking:
  json_logging: true
  wandb_mode: offline
checkpoint:
  generator: checkpoints/gen_vae_train/refit.pt
  encoder: checkpoints/baseline_cnn_subject_split/refit.pt
dataset:
  name: ninapro_db2
  exercise: B
  split_manifest: configs/splits/subject_independent_v1.yaml
  window_size: 400
  stride: 100
  input_channels: 12
  num_classes: 18
  normalize: train_subjects_global_stats
discriminator:
  type: mlp
  hidden_dim: 128
  dropout: 0.1
  epochs: 20
  learning_rate: 0.001
  # Never point an iterative gate at split_manifest.test_subjects.
  evaluate_on: pending_development_validation_subjects
  # Calibrates the test: the discriminator MUST score near 1.0 against this deliberately
  # poor generator, otherwise a near-chance AUC on real synthetic data is meaningless.
  sanity_generator: gaussian_matched_moments
development_gate:
  status: pending_decision
  subject_source: null
  fold_aggregation: null
  # Must cover the population-conditioned k=0 distribution and the subject-conditioned k>0
  # distributions that G3 actually consumes, rather than one pooled unconditional AUC.
  conditioning_coverage: null
final_test_diagnostic:
  status: pending_decision
  subject_source: split_manifest.test_subjects
  tuning_after_observation: forbidden
  failure_policy: null
evaluation:
  per_class: true              # a pooled AUC hides a generator that fails on rare movements
  metrics:
    - discriminator_auc
    - discriminator_auc_confidence_interval
    - nearest_neighbour_distance   # memorization / diversity check
    - per_class_discriminator_auc
  gate:
    pass_if_auc_within: [0.45, 0.55]
    sanity_generator_auc_above: 0.90
