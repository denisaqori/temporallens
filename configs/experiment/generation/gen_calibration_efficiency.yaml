# G4 — Calibration efficiency. Expected calibration error and overconfidence-on-wrong against
# k complete gesture trials per held-out subject, for the same three strategies as G3. NOTE the
# collision of terms: this measures
# PROBABILITY calibration over a SUBJECT-CALIBRATION axis (README section 2).
#
# Exists because augmentation could raise accuracy while making the model confidently wrong,
# which for a wearable interface is a poor trade. ECE binning, the overconfidence-error definition,
# and headline aggregation are encoded below as execution blockers; the current pooled aggregation
# value is explicitly provisional.
# Spec: docs/experiments/generative-arm.md, G4.
protocol:
  # The eventual runner must reject any status other than ready; pending values never get defaults.
  status: blocked_pending_decisions
  blocked_on:
    - personalization.rest_calibration_policy
    - personalization.trial_selection.reproducibility
    - personalization.adaptation.training_budget
    - personalization.adaptation.objective
    - personalization.synthetic.replay_control
    - evaluation.ece_binning
    - evaluation.overconfidence_error_definition
    - evaluation.headline_ece_aggregation_status
experiment:
  name: gen_calibration_efficiency
  seed: 42
  mode: evaluate
tracking:
  json_logging: true
  wandb_mode: offline
checkpoint:
  generator: checkpoints/gen_vae_train/refit.pt
  encoder: checkpoints/baseline_cnn_subject_split/refit.pt
dataset:
  name: ninapro_db2
  exercise: B
  split_manifest: configs/splits/subject_independent_v1.yaml
  window_size: 400
  stride: 100
  input_channels: 12
  num_classes: 18
  normalize: train_subjects_global_stats
personalization:
  calibration_trials: [0, 1, 2, 5, 10, 17, 20, 34]
  k_unit: complete_active_gesture_trial
  k_scope: per_subject
  # Eligible calibration/evaluation repetitions come only from the verified split manifest.
  schedules_per_subject: 5
  trial_selection:
    select_before_windowing: true
    include_all_contained_windows: true
    forbid_boundary_crossing_windows: true
    schedule: nested_class_aware_prefix
    first_pass: one_trial_per_gesture
    second_pass: other_eligible_repetition
    seed_derivation: sha256_64bit_experiment_seed_subject_schedule
    first_pass_repetition_assignment: alternating_8_9_flip_by_subject_plus_schedule_parity
    shared_across_strategies: true
    reproducibility:
      status: pending_decision
      prng: null
      schedule_index_base: null
      persist_selected_trial_ids: true
  rest_calibration_policy: pending_mat_inspection
  calibration_strategy:
    - population_no_adaptation
    - real_adaptation
    - real_plus_synthetic_adaptation
  synthetic:
    windows_per_class: 50
    class_scope: all_output_classes
    conditioning_at_k0: population_embedding
    conditioning_at_k: calibration_derived_from_k_only
    replay_control:
      status: pending_decision
      strategy: null
  adaptation:
    type: head_only_finetune
    initialization: f1_population_head
    matched_optimizer_steps_at_k_gt_0: true
    training_budget:
      status: pending_decision
      optimizer_steps: null
      batch_size: null
      real_synthetic_batch_mix: null
      synthetic_loss_weight: null
    objective:
      status: pending_decision
      optimizer: null
      loss: null
      class_weight_source: null
      learning_rate: null
      regularization: null
      absent_class_handling: null
evaluation:
  fixed_evaluation_set: true
  ece_binning:
    status: pending_decision
    bins: null
    strategy: null
  overconfidence_error_definition: pending_decision
  headline_ece_aggregation_status: pending_decision
  # Provisional legacy value; Pending must resolve its headline/supplemental/omitted role.
  headline_ece_aggregation: pooled_predictions_across_subjects
  report_per_subject: true
  metrics:
    - expected_calibration_error
    - overconfidence_error
    - ece_vs_k_curve
    - per_subject_expected_calibration_error
  save_predictions: true
