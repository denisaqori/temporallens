# G4 — Calibration efficiency. Expected calibration error and overconfidence-on-wrong against
# k complete gesture trials per held-out subject, for the same four strategies as G3. NOTE the
# collision of terms: this measures
# PROBABILITY calibration over a SUBJECT-CALIBRATION axis (README section 2).
#
# Exists because augmentation could raise accuracy while making the model confidently wrong,
# which for a wearable interface is a poor trade. The headline aggregation remains an execution
# blocker and stays Pending; no pooled aggregation is silently supplied. D23 fixes ECE binning,
# and D25 fixes the overconfidence-error definition.
# Spec: docs/experiments/generative-arm.md, G4.
protocol:
  # The eventual runner must reject any status other than ready; pending values never get defaults.
  status: blocked_pending_decisions
  blocked_on:
    - personalization.rest_calibration_policy
    # D28 fixed the objective's FORM; the numeric grid is still undeclared, and a grid
    # declared after results are inspected is not a selection protocol.
    - personalization.adaptation.objective.candidate_grid
    - personalization.adaptation.training_budget.synthetic_only_k0_optimizer_steps
    - personalization.repeated_run_reproducibility
    - evaluation.within_subject_repeat_aggregation
    - evaluation.headline_ece_aggregation_status
experiment:
  name: gen_calibration_efficiency
  seed: 42
  mode: evaluate
tracking:
  json_logging: true
  wandb_mode: offline
checkpoint:
  # Final all-32-subject pipeline only. Development selection builds fresh fold-local artifacts
  # under personalization.adaptation.objective.development_selection; it must not reuse these.
  generator: checkpoints/gen_vae_train/refit.pt
  encoder: checkpoints/baseline_cnn_subject_split/refit.pt
dataset:
  name: ninapro_db2
  exercise: B
  split_manifest: configs/splits/subject_independent_v1.yaml
  window_size: 400
  stride: 100
  input_channels: 12
  num_classes: 18
  normalize: train_subject_covered_sample_stats
personalization:
  calibration_trials: [0, 1, 2, 5, 10, 17, 20, 34]
  k_unit: complete_active_gesture_trial
  k_scope: per_subject
  # Eligible calibration/evaluation repetitions come only from the verified split manifest.
  schedules_per_subject: 5
  trial_selection:
    select_before_windowing: true
    include_all_contained_windows: true
    forbid_boundary_crossing_windows: true
    schedule: nested_class_aware_prefix
    first_pass: one_trial_per_gesture
    second_pass: other_eligible_repetition
    seed_derivation: temporallens_rng_v1
    randomization_scope: g3_g4_personalization
    randomization_purpose: acquisition_schedule
    seed_indices: [subject_id, schedule_index]
    first_pass_repetition_assignment: alternating_8_9_flip_by_subject_plus_schedule_parity
    shared_across_strategies: true
    reproducibility:
      status: ready
      prng: numpy_pcg64
      schedule_index_base: 0
      permutation_algorithm: d45_three_sequential_numpy_permutations
      permutation_call_order: [ascending_active_gestures, ascending_complement_rep_1_gestures, ascending_complement_rep_4_gestures]
      second_pass_order: shuffled_complement_groups_interleaved_underrepresented_repetition_first
      parity_to_starting_repetition: {even: 1, odd: 4}
      assignment_artifact: data/processed/assignments/g3_g4_personalization/v1/{source_pool_sha256}/subject{subject_id}/schedule{schedule_index}.json
      assignment_reuse: load_verified_existing_or_create_once
      require_trusted_file_sha256: true
      assignment_registry: configs/splits/assignment_registry.yaml  # D46 Git-tracked trust anchor
      creation_verification: regenerate_under_recorded_numpy_version
      persist_selected_trial_ids: true
      persist_rng_provenance: true
      persist_before_fitting: true
      required_assignment_provenance: [source_pool_identity, source_pool_sha256, assignment_sha256]
      required_rng_provenance: [key, derived_seed, assignment_prng, numpy_version]
  rest_calibration_policy: pending_decision
  repeated_run_reproducibility:
    status: pending_decision
    adaptation_seed_count: null
    adaptation_seed_derivation: temporallens_rng_v1
    synthetic_draw_count: null
    synthetic_draw_seed_derivation: temporallens_rng_v1
    seed_index_base: 0
    draw_index_base: 0
    component_stream_keys: null
    repeat_axis_pairing: null
    persist_adaptation_seed_and_synthetic_draw_id: true
  calibration_strategy:
    - population_no_adaptation
    - real_adaptation
    # D29: the two replay arms differ ONLY by the conditioning embedding. Everything else --
    # synthetic labels, latent-noise draws, real data, initialization, ordering -- is shared, so
    # the pair is a matched comparison rather than two independent runs.
    - real_plus_population_synthetic_adaptation
    - real_plus_subject_synthetic_adaptation
  synthetic:
    windows_per_class: 50
    class_scope: all_output_classes
    conditioning_by_strategy:
      real_plus_population_synthetic_adaptation:
        at_k0: population_embedding
        at_k_gt_0: population_embedding
      real_plus_subject_synthetic_adaptation:
        at_k0: population_embedding
        at_k_gt_0: calibration_derived_from_k_only
    bank_lifetime:
      at_k0: once_per_synthetic_draw_id_shared_across_subjects_and_schedules
      at_k_gt_0: once_per_subject_schedule_k_and_synthetic_draw_id
    reuse_bank_across_optimizer_steps: true
    persist_synthetic_draw_id: true
    replay_control:
      strategy: paired_population_and_subject_conditioned_arms
      shared_across_the_two_replay_arms:
        - synthetic_class_labels
        - latent_noise_draws
        - synthetic_draw_id
        - real_calibration_windows
        - head_initialization
        - example_ordering
        - adaptation_seed
      k0_shared_head_scope: one_per_adaptation_seed_and_synthetic_draw_id_across_subjects_and_schedules
      isolates: subject_conditioning_beyond_generic_replay
  k0_execution_aliases:
    population_no_adaptation: shared_no_adaptation_head
    real_adaptation: shared_no_adaptation_head
    real_plus_population_synthetic_adaptation: shared_population_conditioned_replay_head
    real_plus_subject_synthetic_adaptation: shared_population_conditioned_replay_head
  k0_artifact_scope:
    shared_no_adaptation_head:
      repeat_identity: none
      shared_across_subjects_and_schedules: true
      evaluation_scope: each_held_out_subject_once
    shared_population_conditioned_replay_head:
      repeat_identity: [adaptation_seed, synthetic_draw_id]
      shared_across_subjects_and_schedules: true
      evaluation_scope: each_held_out_subject_once_per_repeat
  adaptation:
    type: head_only_finetune
    initialization: f1_population_head
    matched_optimizer_steps_at_k_gt_0: true
    # D28. Full-batch, so minibatch composition and cycling stop being protocol variables.
    # At the largest k that is ~3,300 real plus 900 synthetic 256-d latents through a small
    # head -- a few MB.
    training_budget:
      batching: full_batch
      # D15 matches steps BETWEEN strategies at the same k. It does not fix one count across
      # all k, so the step count may vary with k under a declared rule.
      optimizer_steps: matched_between_strategies_at_each_k
      optimizer_steps_rule: selected_on_development_folds
      # Real adaptation is a no-op at k=0, so it cannot select the step count for the synthetic-only
      # replay diagnostic. Keep this explicit and blocked rather than inheriting a runner default.
      synthetic_only_k0_optimizer_steps:
        status: pending_decision
        assignment_rule: null
      # Every k restarts from the F1 head with a fresh optimizer. Warm-starting k=2 from k=1
      # would make the curve a cumulative process, not independent k-shot adaptation.
      warm_start_along_the_curve: forbidden
      synthetic_loss_weight: 1.0
    objective:
      optimizer: adam
      # ADDITIVE, not averaged. J_real = L_real + beta*R_SP; J_replay = J_real + lambda*L_syn.
      # This embeds the entire real-only objective with its coefficient unchanged and adds
      # exactly one intervention. It preserves the ALGEBRAIC COEFFICIENT of the real objective
      # and nothing else: the realized update, trajectory, gradient norm and effective step all
      # change, by design, because that is the intervention.
      loss: additive_weighted_real_plus_unweighted_synthetic
      real_loss: weight_normalised_class_weighted_cross_entropy
      synthetic_loss: unweighted_mean_cross_entropy
      # Both sources are normalised to a per-source MEAN. The real set spans ~97 windows at k=1
      # to ~3,300 at k=34, so an unnormalised sum would make the loss scale a function of k and
      # the curve would partly measure that. Normalised, lambda_syn=1 means one unit of average
      # synthetic loss against one unit of average real loss.
      real_loss_reduction: sum_w_times_ce_over_sum_w
      synthetic_loss_reduction: mean_over_synthetic_windows
      # Inverse-frequency weights exist to flatten a skewed distribution. The synthetic bank is
      # already flat at 50 windows per class, so weighting it would DE-balance it toward rare
      # population classes.
      synthetic_is_unweighted_because: bank_is_already_class_balanced
      class_weight_source: f1_population_class_weights
      class_weight_fitted_on: development_fold_28_subjects_then_all_32_for_the_final_pipeline
      # L2-SP: anchor to the pretrained solution, not toward zero. Ordinary weight decay would
      # pull toward a degenerate head and would silently compete with this anchor.
      regularization: l2_sp_to_f1_head
      l2_sp_scope: head_parameters
      l2_sp_reduction: sum_over_head_parameters
      adam_weight_decay: 0.0
      # Shared hyperparameters are tuned on real_adaptation ONLY, then frozen for both replay
      # arms: treatment-specific tuning is the thing to avoid. The resulting bias direction is
      # NOT known -- under the additive objective the fixed anchor is relatively weaker against
      # a larger data loss. This is a shared anti-cherry-picking rule, not an unbiased estimator.
      shared_hyperparameters_tuned_on: real_adaptation_only
      learning_rate: selected_on_development_folds
      development_selection:
        split_manifest: configs/splits/subject_independent_v1.yaml
        fold_index_source: split_manifest.folds[].index
        # k=0 is excluded because real adaptation is a no-op there; its synthetic-only replay
        # diagnostic has the separate pending step assignment declared in training_budget.
        selection_k_values: [1, 2, 5, 10, 17, 20, 34]
        population_fit: fold_training_complement_28_subjects
        scoring_subjects: fold_validation_4_subjects
        training_subject_rule: split_manifest.training_subjects_minus_current_fold_validation_subjects
        scoring_subject_rule: current_fold_validation_subjects
        model_training_budget: d18_d19_accepted_refit_budget
        generator_training_budget: frozen_generator_source_config_training_epochs
        checkpoint_selection_on_outer_four: forbidden
        artifact_resolution:
          source: build_from_frozen_source_configs_and_persist
          encoder_source_config: configs/experiment/foundation/baseline_cnn_subject_split.yaml
          generator_source_config: configs/experiment/generation/gen_vae_train.yaml
          generator_encoder_source: fold_local_fixed_budget_encoder
          encoder_checkpoint_pattern: checkpoints/baseline_cnn_subject_split/development/fold{fold_index}/fixed_budget.pt
          generator_checkpoint_pattern: checkpoints/gen_vae_train/development/fold{fold_index}/fixed_budget.pt
          all_32_refit_reuse: forbidden
          generator_parent_encoder_identity: exact_artifact_sha256
          cross_fold_latent_pooling: forbidden
          fold_fitted_components:
            - normalization_statistics
            - class_weights
            - encoder_and_population_head
            - latent_centroids
            - population_embedding
            - generator
          required_provenance:
            - manifest_hash
            - fold_index
            - training_subject_ids
            - scoring_subject_ids
            - component_config_digests
            - training_budget
            - generator_training_budget
            - artifact_sha256
            - parent_encoder_sha256
        result_role: hyperparameter_selection_only
      candidate_grid:
        status: pending_decision
        learning_rate: null
        optimizer_steps: null
        optimizer_steps_scope: null
        l2_sp_beta: null          # must include 0.0 so "no anchoring" stays available
        selection_metric: null
        selection_aggregation: null
        tie_break: null
      # All 18 output rows stay active. Seen/unseen degradation is the phenomenon G3 measures,
      # so masking or freezing absent classes would shrink the gap the headline reports.
      absent_class_handling: all_outputs_remain_active
evaluation:
  primary_classification_metric: macro_f1
  primary_calibration_metric: expected_calibration_error_temperature_scaled
  fixed_evaluation_set: true
  # Repeat aggregation is distinct from the headline ECE aggregation below. Both remain blocked:
  # first summarize schedules/seeds/draws within subject, then choose the across-subject headline.
  within_subject_repeat_aggregation:
    status: pending_decision
    applicable_repeat_axes: strategy_specific
    point_summary: null
    spread_summary: null
    axis_order_or_joint_reduction: null
    shared_population_reference: deduplicate_before_summary
    reused_evaluation_windows_are_independent: false
  # D33: fitted after settings freeze from adapted DEVELOPMENT heads; no final-subject T fit.
  ece:
    bins: 10
    binning: equal_mass
    scope: top_label
    temperature_scaling: true
    temperature_source: frozen_strategy_k_temperature_table
    report: [raw, temperature_scaled]
  brier:
    report: [raw, temperature_scaled]
  temperature_fit:
    stage: after_adaptation_settings_freeze
    source_artifacts: personalization.adaptation.objective.development_selection.artifact_resolution
    prediction_source: all_four_strategies_on_outer_development_subject_queries
    support_repetitions: split_manifest.repetitions.calibration
    query_repetitions: split_manifest.repetitions.evaluation
    cell_scope: strategy_and_calibration_trials
    cell_fitting: separate_no_smoothing_across_k
    objective: ordinary_negative_log_likelihood
    class_weighting: none
    subject_weighting: equal
    repeat_weighting: equal_within_subject
    window_weighting: equal_within_repeat
    aggregate_logits_before_fitting: forbidden
    deduplicate_aliases_before_weighting: true
    fit_scope: development_only
    final_test_fitting: forbidden
    extra_final_subject_trials: 0
    development_subjects_reused_after_selection: true
    development_metrics_role: calibration_fitting_diagnostic_only
    population_reference_temperature: fit_on_query_repetitions_once_for_all_k
    inherit_f1_temperature: forbidden
    k0_temperature_aliases:
      population_no_adaptation: population_reference
      real_adaptation: population_reference
      real_plus_population_synthetic_adaptation: population_replay
      real_plus_subject_synthetic_adaptation: population_replay
    freeze_before_final_test: true
    artifact_pattern: results/runs/{immutable_run_id}/temperature_table.json
    artifact_identity: sha256
    required_provenance:
      - manifest_hash
      - development_subject_and_fold_ids
      - support_and_query_repetition_ids
      - frozen_settings_digest
      - source_config_digests
      - fold_encoder_and_generator_sha256
      - generator_parent_encoder_sha256
      - deployment_population_checkpoint_sha256
      - deployment_generator_sha256
      - query_logits_sha256
      - schedule_seed_and_draw_ids
      - normalized_fitting_weights
      - cell_subject_repeat_window_counts
      - temperature_values_and_aliases
      - fit_diagnostics
      - freeze_timestamp
    execution:
      status: ready
      # D39: optimize beta=1/T, where weighted NLL is convex, in float64.
      solver: scipy_minimize_scalar_bounded
      parameter: inverse_temperature
      dtype: float64
      bounds: [0.01, 100.0]
      tolerance: 0.00000001
      max_iterations: 500
      nll_evaluation: stable_logsumexp
      fitting_weights: normalized_d33_weights
      boundary_check: weighted_nll_derivative_at_bounds
      nll_non_regression_reference: temperature_1
      nll_non_regression_tolerance: 0.00000001
      persist_solver_diagnostics: true
      invalid_or_unresolved_boundary_fit: block_reportable_evaluation
  calibration_execution:
    # D39: unhalved multiclass Brier; nominal M=10, with confidence ties kept together.
    brier_reduction: mean_windows_of_sum_over_classes
    equal_mass_tie_handling:
      quantile_method: linear
      boundary_assignment: upper_bin_for_equal_cutpoint
      tied_confidences: keep_together
      duplicate_cutpoints: collapse
      empty_bins: omit
      effective_bin_count: report
      bin_occupancies: report
      label_information_in_boundaries: forbidden
    bootstrap_seed: experiment.seed
    bootstrap_resamples: 10000
    bootstrap_confidence: 0.95
    raw_versus_scaled_result_keys: metric_family_plus_raw_or_temperature_scaled_suffix
  uncertainty_resampling_unit: subject
  headline_ece_aggregation_status: pending_decision
  # Probability version is settled; across-subject aggregation still requires its own decision.
  headline_ece_aggregation: pending_decision
  report_per_subject: true
  metrics:
    - macro_f1
    - per_subject_macro_f1
    - expected_calibration_error
    - mean_confidence_when_wrong
    - brier_score
    - overconfidence_error
    - ece_vs_k_curve
    - per_subject_expected_calibration_error
    - per_subject_brier_score
    - per_subject_overconfidence_error
  save_predictions: true
