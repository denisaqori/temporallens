# G3 — THE HEADLINE. For each held-out subject, decoding accuracy as a function of k, the
# number of real calibration samples, under three strategies. The headline number is the
# HORIZONTAL gap: how many fewer real samples real_plus_synthetic needs to match real_only.
#
# Gated on G2: do not report this if the synthetic-quality gate failed.
#
# calibration_strategy is a PLUGGABLE AXIS by design (D5) — bolted on later it means rewriting
# the loop. k is PER SUBJECT, not per class: with 18 classes and k=5 most classes have zero
# calibration samples, which is the realistic deployment framing (a new user provides a handful
# of examples total). Each (subject, k) cell is repeated over several draws because sampling
# which k windows a subject provides is itself a high-variance choice at small k.
# Spec: docs/experiments/generative-arm.md, G3 — read the five leakage rules first.
experiment:
  name: gen_personalization_efficiency
  seed: 42
  mode: evaluate
tracking:
  json_logging: true
  wandb_mode: online
checkpoint:
  generator: checkpoints/gen_vae_train/best.pt
  encoder: checkpoints/baseline_cnn_subject_split/best.pt
dataset:
  name: ninapro_db2
  exercise: B
  split: subject_independent
  held_out_subjects: [5, 10, 15, 20, 25, 30, 35, 40]
  window_size: 400
  stride: 100
  input_channels: 12
  num_classes: 18
  normalize: train_subjects_global_stats
personalization:
  calibration_samples: [0, 5, 10, 20, 50]   # k
  k_scope: per_subject                      # NOT per class — see top comment
  draws_per_cell: 5                         # repeat each (subject, k) cell; report spread
  calibration_strategy:
    - real_only
    - real_plus_synthetic
    - real_plus_adaptation
  synthetic:
    samples_per_class: 50
    # k=0: no subject-specific information exists, by definition (leakage rule 2)
    conditioning_at_k0: population_embedding
    # k>0: conditioning derived ONLY from the k permitted samples (leakage rule 3)
    conditioning_at_k: calibration_derived_from_k_only
  adaptation:
    type: head_only_finetune   # not full fine-tune, not TTA — keeps trainable surface matched
    epochs: 10
    learning_rate: 0.001
evaluation:
  fixed_evaluation_set: true   # never varies with k or strategy (leakage rule 5)
  report_per_subject: true     # a mean over 8 subjects can hide one at chance
  metrics:
    - accuracy
    - macro_f1
    - per_subject_accuracy
    - accuracy_vs_k_curve
    - real_samples_saved       # the headline: horizontal gap between curves
  save_predictions: true
