# G3 — THE HEADLINE. For each held-out subject, decoding accuracy as a function of k, the total
# number of complete real gesture trials the subject supplies. Every valid window wholly inside a
# selected trial is used, but windows are not calibration units. The headline is the HORIZONTAL
# gap: how many fewer real gesture trials real_plus_synthetic_adaptation needs to match
# real_adaptation.
#
# Gated on G2: do not report this if the synthetic-quality gate failed.
#
# calibration_strategy is a PLUGGABLE AXIS by design (D5/D15). k is PER SUBJECT, not per class:
# at k<17, the experiment intentionally tests transfer to gestures the subject did not demonstrate.
# Each (subject, schedule) uses one class-aware, repetition-balanced acquisition schedule whose k
# sets are nested prefixes and are shared across all strategies (D14).
# Spec: docs/experiments/generative-arm.md, G3 — read the five leakage rules first.
protocol:
  # The eventual runner must reject any status other than ready; pending values never get defaults.
  status: blocked_pending_decisions
  blocked_on:
    - personalization.rest_calibration_policy
    - personalization.adaptation.training_budget
    - evaluation.headline_extraction
    - evaluation.subgroup_aggregation
experiment:
  name: gen_personalization_efficiency
  seed: 42
  mode: evaluate
tracking:
  json_logging: true
  wandb_mode: online
checkpoint:
  generator: checkpoints/gen_vae_train/refit.pt
  encoder: checkpoints/baseline_cnn_subject_split/refit.pt
dataset:
  name: ninapro_db2
  exercise: B
  split: subject_independent
  held_out_subjects: [5, 10, 15, 20, 25, 30, 35, 40]
  window_size: 400
  stride: 100
  input_channels: 12
  num_classes: 18
  normalize: train_subjects_global_stats
personalization:
  calibration_trials: [0, 1, 2, 5, 10, 17, 20, 34]  # k; 17 gestures x reps {1,4} = 34 max
  k_unit: complete_active_gesture_trial
  k_scope: per_subject                              # total across gestures, NOT per class
  eligible_repetitions: [1, 4]
  schedules_per_subject: 5                          # Monte Carlo schedules, not inferential units
  trial_selection:
    select_before_windowing: true
    include_all_contained_windows: true
    forbid_boundary_crossing_windows: true
    schedule: nested_class_aware_prefix
    first_pass: one_trial_per_gesture
    second_pass: other_eligible_repetition
    seed_derivation: sha256_64bit_experiment_seed_subject_schedule
    first_pass_repetition_assignment: alternating_8_9_flip_by_subject_plus_schedule_parity
    shared_across_strategies: true
  # Rest is an evaluation class but does not increment k. Fail closed until an actual MAT file
  # establishes how corrected rest intervals attach to selected gesture trials (DECISIONS Pending).
  rest_calibration_policy: pending_mat_inspection
  calibration_strategy:
    - population_no_adaptation
    - real_adaptation
    - real_plus_synthetic_adaptation
  synthetic:
    windows_per_class: 50
    class_scope: all_output_classes
    # k=0: no subject-specific information exists, by definition (leakage rule 2)
    conditioning_at_k0: population_embedding
    # k>0: conditioning derived ONLY from windows in the k permitted trials (leakage rule 3)
    conditioning_at_k: calibration_derived_from_k_only
  adaptation:
    type: head_only_finetune
    initialization: f1_population_head
    matched_optimizer_steps_at_k_gt_0: true
    training_budget:
      status: pending_decision
      optimizer_steps: null
      batch_size: null
      real_synthetic_batch_mix: null
      synthetic_loss_weight: null
    learning_rate: 0.001
evaluation:
  fixed_evaluation_set: true   # never varies with k or strategy (leakage rule 5)
  evaluation_repetitions: [2, 3, 5, 6]
  report_per_subject: true     # a mean over 8 subjects can hide one at chance
  headline_extraction: pending_decision
  subgroup_aggregation:
    status: pending_decision
    aggregation: null
    empty_group_result: null_metric
  metrics:
    - accuracy
    - macro_f1
    - per_subject_accuracy
    - calibration_seen_gesture_accuracy
    - calibration_unseen_gesture_accuracy
    - rest_accuracy
    - demonstrated_gesture_count
    - accuracy_vs_k_curve
    - real_gesture_trials_saved  # headline: horizontal gap between the two adapted curves
  save_predictions: true
