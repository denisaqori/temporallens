# F2 — LEAKAGE DEMONSTRATION, NOT A GENERALIZATION RESULT. Same architecture/loss as F1; windows
# from the 32 development subjects are shuffled without regard to subject (D41). Windows from one subject are highly correlated, so a random split puts
# near-duplicates on both sides and inflates accuracy dramatically. This number exists ONLY to
# quantify that inflation. Reporting it without labelling it as the leakage demo is a serious
# error. Spec: docs/experiments/README.md, sections 3.2 and 6.
protocol:
  # Gates REPORTABILITY, not training. Producing a checkpoint is how the vertical slice proceeds;
  # what is blocked is quoting numbers from it. The evaluator must reject any status other than
  # `ready`, and pending values never get defaults.
  status: blocked_pending_decisions
  blocked_on:
    - evaluation.temperature_fit.execution.fold_assignment_algorithm
    - evaluation.temperature_fit.execution.seed_derivation
experiment:
  name: baseline_cnn_random_split
  seed: 42
  mode: train
tracking:
  json_logging: true
  wandb_mode: offline
dataset:
  name: ninapro_db2
  data_dir: data/processed/ninapro_db2
  exercise: B
  split: random_window
  # D41: the window pool is the 32 development subjects only. The eight final test subjects never
  # enter a population fit, and F2 is one. The leakage F2 demonstrates comes from splitting windows
  # *within* subjects, which needs no test subject to show.
  split_manifest: configs/splits/subject_independent_v1.yaml
  subject_pool: split_manifest.training_subjects
  test_fraction: 0.2
  window_size: 400
  stride: 100
  input_channels: 12
  num_classes: 18
  normalize: train_split_covered_sample_stats
model:
  type: cnn1d
  input_channels: 12
  hidden_dim: 128
  embedding_dim: 256
  num_classes: 18
  dropout: 0.2
training:
  loss: class_weighted_cross_entropy
  batch_size: 64
  epochs: 30
  learning_rate: 0.0003
  weight_decay: 0.0001
  num_workers: 2
  device: auto
  save_checkpoint: true
evaluation:
  # Per-subject ECE is descriptive for SEEN subjects, never unseen-subject generalization.
  # D33 adds calibration-only window folds inside the non-test pool; no subject-CV claim follows.
  primary_classification_metric: macro_f1
  primary_calibration_metric: expected_calibration_error_temperature_scaled
  ece:
    bins: 10
    binning: equal_mass
    scope: top_label
    temperature_scaling: true
    temperature_source: model_config.probability_calibration
    report: [raw, temperature_scaled]
  brier:
    report: [raw, temperature_scaled]
  temperature_fit:
    prediction_source: pooled_window_out_of_fold_fixed_budget_models
    development_pool: non_test_80_percent_windows
    final_test_pool: fixed_outer_20_percent_windows
    folds: 8
    partition_unit: random_window
    population_fit: current_inner_fold_training_windows_only
    preprocessing_fit: current_inner_fold_training_windows_only
    class_weight_fit: current_inner_fold_training_windows_only
    training_budget: configured_training_epochs
    final_refit: all_non_test_windows_same_training_budget
    persist_outer_test_and_inner_fold_assignments: true
    overlapping_window_contamination: intentional_leakage_demo
    objective: ordinary_negative_log_likelihood
    class_weighting: none
    subject_weighting: equal
    repeat_weighting: equal_within_subject
    window_weighting: equal_within_repeat
    fit_scope: development_only
    freeze_before_final_test: true
    final_test_fitting: forbidden
    development_metrics_role: calibration_fitting_diagnostic_only
    artifact: model_config.probability_calibration
    required_provenance: [window_assignment_sha256, fold_artifact_sha256, config_digests, query_logits_sha256, subject_ids, fitting_weights, fit_diagnostics]
    execution:
      status: pending_decision
      fold_assignment_algorithm: null
      seed_derivation: null
      # D39: optimize beta=1/T, where weighted NLL is convex, in float64.
      solver: scipy_minimize_scalar_bounded
      parameter: inverse_temperature
      dtype: float64
      bounds: [0.01, 100.0]
      tolerance: 0.00000001
      max_iterations: 500
      nll_evaluation: stable_logsumexp
      fitting_weights: normalized_d33_weights
      boundary_check: weighted_nll_derivative_at_bounds
      nll_non_regression_reference: temperature_1
      nll_non_regression_tolerance: 0.00000001
      persist_solver_diagnostics: true
      invalid_or_unresolved_boundary_fit: block_reportable_evaluation
  calibration_execution:
    # D39: unhalved multiclass Brier; nominal M=10, with confidence ties kept together.
    brier_reduction: mean_windows_of_sum_over_classes
    equal_mass_tie_handling:
      quantile_method: linear
      boundary_assignment: upper_bin_for_equal_cutpoint
      tied_confidences: keep_together
      duplicate_cutpoints: collapse
      empty_bins: omit
      effective_bin_count: report
      bin_occupancies: report
      label_information_in_boundaries: forbidden
    bootstrap_seed: experiment.seed
    bootstrap_resamples: 10000
    bootstrap_confidence: 0.95
    raw_versus_scaled_result_keys: metric_family_plus_raw_or_temperature_scaled_suffix
  per_subject_metric_role: descriptive_seen_subject_only
  uncertainty_resampling_unit: subject
  metrics:
    - accuracy
    - macro_f1
    - per_class_precision
    - per_class_recall
    - confusion_matrix
    - expected_calibration_error
    - overconfidence_error
    - mean_confidence_when_wrong
    - per_subject_expected_calibration_error
    - brier_score
  save_predictions: true
