# F4 — Robustness under channel dropout (electrode failure / missing channels), zero-shot at
# test time. Levels are the number of channels dropped, out of 12.
#
# Target-agnostic: no checkpoint here. Targets come from robustness_targets.yaml; the runner
# evaluates this perturbation against every present target (D2). Spec: docs/experiments/README.md,
# section 6.
experiment:
  name: robustness_channel_dropout
  seed: 42
  mode: evaluate
tracking:
  json_logging: true
  wandb_mode: offline
dataset:
  name: ninapro_db2
  exercise: B
  split: subject_independent
  window_size: 400
  stride: 100
perturbation:
  type: channel_dropout
  levels: [1, 2, 4, 6]
evaluation:
  metrics:
    - accuracy
    - macro_f1
    - per_subject_accuracy
    - expected_calibration_error
    - robustness_drop
  save_predictions: true
