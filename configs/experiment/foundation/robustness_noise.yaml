# F3 — Robustness under additive sensor noise, applied zero-shot at test time. Measures whether
# a model's accuracy survives realistic shift, reported as robustness_drop (clean -> perturbed).
#
# The perturbation acts on the INPUT window and is target-agnostic. It carries no checkpoint:
# the model(s) to evaluate come from configs/experiment/robustness_targets.yaml, and the runner
# evaluates this perturbation against every target whose checkpoint exists (D2 — every arm, not
# just the encoder). Spec: docs/experiments/README.md, section 6.
experiment:
  name: robustness_noise
  seed: 42
  mode: evaluate
tracking:
  json_logging: true
  wandb_mode: offline
dataset:
  name: ninapro_db2
  exercise: B
  split_manifest: configs/splits/subject_independent_v1.yaml
  window_size: 400
  stride: 100
perturbation:
  type: additive_noise
  levels: [0.01, 0.05, 0.10, 0.20]
evaluation:
  # D23: use the target checkpoint's already-fitted T; never recalibrate on perturbed test data.
  ece:
    bins: 10
    binning: equal_mass
    scope: top_label
    temperature_scaling: true
    temperature_source: checkpoint_model_config
    report: [raw, temperature_scaled]
  uncertainty_resampling_unit: subject
  metrics:
    - accuracy
    - macro_f1
    - per_subject_accuracy
    - expected_calibration_error
    - overconfidence_error
    - mean_confidence_when_wrong
    - per_subject_expected_calibration_error
    - brier_score
    - robustness_drop
  save_predictions: true
