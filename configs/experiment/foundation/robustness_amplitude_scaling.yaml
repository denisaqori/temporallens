# F5 — Robustness under amplitude scaling (contraction strength / skin impedance / electrode
# placement), zero-shot at test time.
#
# Target-agnostic: no checkpoint here. Targets come from robustness_targets.yaml; the runner
# evaluates this perturbation against every present target (D2). Spec: docs/experiments/README.md,
# section 6.
protocol:
  # Gates REPORTABILITY, not training. Producing a checkpoint is how the vertical slice proceeds;
  # what is blocked is quoting numbers from it. The evaluator must reject any status other than
  # `ready`, and pending values never get defaults.
  status: blocked_pending_decisions
  blocked_on:
    - perturbation.apply_order_relative_to_normalization
    - perturbation.sampling
    - perturbation.seed_derivation
    - perturbation.repetitions_per_level
    - perturbation.level_aggregation
experiment:
  name: robustness_amplitude_scaling
  seed: 42
  mode: evaluate
tracking:
  json_logging: true
  wandb_mode: offline
dataset:
  name: ninapro_db2
  exercise: B
  split_manifest: configs/splits/subject_independent_v1.yaml
  window_size: 400
  stride: 100
perturbation:
  type: amplitude_scaling
  levels: [0.5, 0.75, 1.25, 1.5]
  # F3-F5 are not executable yet: the perturbation has a type and levels but no operational
  # definition. A runner default for any of these would quietly become the protocol.
  apply_order_relative_to_normalization: null
  sampling: null
  seed_derivation: null
  repetitions_per_level: null
  level_aggregation: null
evaluation:
  # D23: use the target checkpoint's already-fitted T; never recalibrate on perturbed test data.
  ece:
    bins: 10
    binning: equal_mass
    scope: top_label
    temperature_scaling: true
    temperature_source: checkpoint_model_config
    report: [raw, temperature_scaled]
  uncertainty_resampling_unit: subject
  metrics:
    - accuracy
    - macro_f1
    - per_subject_accuracy
    - expected_calibration_error
    - overconfidence_error
    - mean_confidence_when_wrong
    - per_subject_expected_calibration_error
    - per_subject_macro_f1
    - per_subject_brier_score
    - per_subject_overconfidence_error
    - brier_score
    - robustness_drop
  save_predictions: true
