# F5 — Robustness under amplitude scaling (contraction strength / skin impedance / electrode
# placement), zero-shot at test time.
#
# Target-agnostic: no checkpoint here. Targets come from robustness_targets.yaml; the runner
# evaluates this perturbation against every present target (D2). Spec: docs/experiments/README.md,
# section 6.
experiment:
  name: robustness_amplitude_scaling
  seed: 42
  mode: evaluate
tracking:
  json_logging: true
  wandb_mode: offline
dataset:
  name: ninapro_db2
  exercise: B
  split_manifest: configs/splits/subject_independent_v1.yaml
  window_size: 400
  stride: 100
perturbation:
  type: amplitude_scaling
  levels: [0.5, 0.75, 1.25, 1.5]
evaluation:
  # D23: adaptive bins, M=10, top-label. Floor (~0.037) is a detection threshold, not an offset.
  ece:
    bins: 10
    binning: equal_mass
    scope: top_label
    temperature_scaling: true
    temperature_source: pooled_out_of_fold_folds
    report: [raw, temperature_scaled]
  uncertainty_resampling_unit: subject
  metrics:
    - accuracy
    - macro_f1
    - per_subject_accuracy
    - expected_calibration_error
    - brier_score
    - robustness_drop
  save_predictions: true
