# F5 — Robustness under amplitude scaling (contraction strength / skin impedance / electrode
# placement), zero-shot at test time.
#
# D2: must run against every arm; checkpoint is still hard-coded to the F1 encoder and needs
# parameterizing first. Spec: docs/experiments/README.md, section 6.
experiment:
  name: robustness_amplitude_scaling
  seed: 42
  mode: evaluate
tracking:
  json_logging: true
  wandb_mode: offline
checkpoint:
  path: checkpoints/baseline_cnn_subject_split/best.pt
  model_type: cnn1d
dataset:
  name: ninapro_db2
  exercise: B
  split: subject_independent
  window_size: 400
  stride: 100
perturbation:
  type: amplitude_scaling
  levels: [0.5, 0.75, 1.25, 1.5]
evaluation:
  metrics:
    - accuracy
    - macro_f1
    - per_subject_accuracy
    - expected_calibration_error
    - robustness_drop
  save_predictions: true
