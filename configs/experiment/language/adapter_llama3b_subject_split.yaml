# L2 — THE METHOD. Soft-prefix conditioning of a frozen, PRETRAINED Llama 3.2 3B, evaluated
# subject-independently. Asks whether LLM conditioning improves decoding, calibration, or
# overconfidence beyond the encoder alone.
#
# NEVER READ THIS ROW ALONE. It is meaningful only as the triple (L2, L3, L4) against the F1
# reference; L2 vs F1 without L3 invites the immediate objection that any gain came from
# parameter count. The encoder is frozen and loaded from F1 — if it trains here this stops
# being an adapter study. adapter.output_dim is auto_from_llm_config: hard-coding the hidden
# size is the most likely cause of "worked locally, failed on the pod".
#
# head.pooling: last_token means the LAST NON-PADDING token, not literally the final position.
# hidden_states[:, -1] is correct only under left-padding; attention_mask.sum(-1) - 1 only under
# right-padding, and only with no interior zeros. Use the rightmost unmasked index,
# L - 1 - mask.to(torch.int64).flip(-1).argmax(-1), then ASSERT the row has an unmasked token and
# the mask at that index is 1. Prepend N ones for the soft prefix to the tokenizer mask, and derive
# both the pooling index and explicit position_ids from that combined mask before calling Llama with
# inputs_embeds. Left-padded text creates interior zeros between the prefix and text; default
# sequential positions would offset the text by the pad count.
#
# Effective batch = batch_size x gradient_accumulation_steps = 32. Changing batch_size alone to
# fit memory silently changes the optimization, not just the memory profile.
# Spec: docs/experiments/language-arm.md, L2.
protocol:
  # Gates REPORTABILITY, not training. Producing a checkpoint is how the vertical slice proceeds;
  # what is blocked is quoting numbers from it. The evaluator must reject any status other than
  # `ready`, and pending values never get defaults.
  status: blocked_pending_decisions
  blocked_on:
    - training.selection
    - training.repeats
    - evaluation.ece.temperature_source
experiment:
  name: adapter_llama3b_subject_split
  seed: 42
  mode: train
tracking:
  json_logging: true
  wandb_mode: online
dataset:
  name: ninapro_db2
  exercise: B
  split_manifest: configs/splits/subject_independent_v1.yaml
  window_size: 400
  stride: 100
  input_channels: 12
  num_classes: 18
  normalize: train_subject_covered_sample_stats
encoder:
  checkpoint: checkpoints/baseline_cnn_subject_split/refit.pt
  freeze: true
  embedding_dim: 256
adapter:
  type: mlp_projector
  input_dim: 256
  num_soft_tokens: 8
  output_dim: auto_from_llm_config
llm:
  name: meta-llama/Llama-3.2-3B
  freeze: true
  torch_dtype: bfloat16
  load_in_4bit: false
head:
  # Discriminative readout. Held IDENTICAL across all three language-arm configs
  # (this one, adapter_random_transformer, adapter_text_summary_only) to control
  # the readout while representations/backbone weights differ. Changing it here
  # without changing it there invalidates the ablation.
  type: mlp
  pooling: last_token            # Llama is causal — classify from the last non-padding token
  input_dim: auto_from_llm_config  # LLM hidden size, read from the model config (never hard-coded)
  hidden_dim: 256
  dropout: 0.1
  num_classes: 18
training:
  target: class_label
  loss: class_weighted_cross_entropy
  batch_size: 4
  gradient_accumulation_steps: 8
  epochs: 5
  learning_rate: 0.0001
  num_workers: 4
  device: cuda
  save_checkpoint: true
  repeats:
    status: pending_decision
    seed_count: null
    seed_derivation: temporallens_rng_v1
    seed_index_base: 0
    component_stream_keys: null
    pairing: seed_index
    shared_seed_count_across_l2_l3_l4: true
    record_component_rng_streams: true
    within_subject_metric_reduction: equal_weight_mean_over_seed_runs
    logit_averaging: forbidden
    outcome_triggered_seed_extension: forbidden
  # L2-L4 report overconfidence_error (D25) but encode no cross-validation/refit selection
  # contract, so there is no gate deciding which checkpoint those numbers come from.
  selection:
    cross_validation_scheme: null
    epoch_selection: null
    refit_rule: null
evaluation:
  primary_classification_metric: macro_f1
  primary_calibration_metric: expected_calibration_error_temperature_scaled
  # D33: source remains blocked until this arm's own selection/refit procedure is defined.
  ece:
    bins: 10
    binning: equal_mass
    scope: top_label
    temperature_scaling: true
    temperature_source: pending_language_selection_contract
    report: [raw, temperature_scaled]
  brier:
    report: [raw, temperature_scaled]
  temperature_fit:
    prediction_source: pending_language_selection_contract
    objective: ordinary_negative_log_likelihood
    class_weighting: none
    subject_weighting: equal
    repeat_weighting: equal_within_subject
    window_weighting: equal_within_repeat
    fit_scope: development_only
    final_test_fitting: forbidden
    freeze_before_final_test: true
    artifact: model_config.probability_calibration
    execution:
      status: ready
      # D39: optimize beta=1/T, where weighted NLL is convex, in float64.
      solver: scipy_minimize_scalar_bounded
      parameter: inverse_temperature
      dtype: float64
      bounds: [0.01, 100.0]
      tolerance: 0.00000001
      max_iterations: 500
      nll_evaluation: stable_logsumexp
      fitting_weights: normalized_d33_weights
      boundary_check: weighted_nll_derivative_at_bounds
      nll_non_regression_reference: temperature_1
      nll_non_regression_tolerance: 0.00000001
      persist_solver_diagnostics: true
      invalid_or_unresolved_boundary_fit: block_reportable_evaluation
  calibration_execution:
    # D39: unhalved multiclass Brier; nominal M=10, with confidence ties kept together.
    brier_reduction: mean_windows_of_sum_over_classes
    equal_mass_tie_handling:
      quantile_method: linear
      boundary_assignment: upper_bin_for_equal_cutpoint
      tied_confidences: keep_together
      duplicate_cutpoints: collapse
      empty_bins: omit
      effective_bin_count: report
      bin_occupancies: report
      label_information_in_boundaries: forbidden
    bootstrap_seed: experiment.seed
    bootstrap_resamples: 10000
    bootstrap_confidence: 0.95
    raw_versus_scaled_result_keys: metric_family_plus_raw_or_temperature_scaled_suffix
  uncertainty_resampling_unit: subject
  metrics:
    - accuracy
    - macro_f1
    - per_subject_accuracy
    - per_class_precision
    - per_class_recall
    - confusion_matrix
    - expected_calibration_error
    - mean_confidence_when_wrong
    - per_subject_expected_calibration_error
    - per_subject_macro_f1
    - per_subject_brier_score
    - per_subject_overconfidence_error
    - brier_score
    - overconfidence_error
  save_predictions: true
